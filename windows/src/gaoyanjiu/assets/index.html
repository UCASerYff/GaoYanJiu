<!doctype html>
<html lang="zh-CN">
<head>

<body data-theme="system">
  <section id="gate" class="gate" hidden>

      <p id="gate-text" role="status"></p>
      <div class="row gate-actions">

        <button id="gate-retry" type="button" data-zh="重新载入" data-en="Reload">重新载入</button>

  <div id="shell" class="shell" hidden>

          <div class="search" role="search">
            <span id="search-icon"></span>
            <input id="search" type="search" autocomplete="off">
            <button id="clear-search" type="button" class="icon-button" hidden></button>
          </div>
        </div>
        <div id="page-tools" class="page-tools"></div>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>
  <dialog id="editor" aria-labelledby="dialog-heading"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="/assets/city-scene.js"></script>

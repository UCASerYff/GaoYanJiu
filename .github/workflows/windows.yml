name: Windows

on:
  push:
    branches-ignore: ['codex/macos-full-regression-415-17']
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Test and build x64 MSI
        shell: pwsh
        run: .\build.ps1
      - name: Smoke-test installation, app, and uninstallation
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath dist -Filter 'GaoYanJiu-Windows-*-x64.msi' | Select-Object -First 1
          if (-not $package) { throw 'The Windows installer was not found' }
          python tests/smoke_install.py $package.FullName --register-shell
      - uses: actions/upload-artifact@v4
        with:
          name: GaoYanJiu-Windows-x64
          if-no-files-found: error
          path: |
            windows/dist/GaoYanJiu-Windows-*-x64.msi
            windows/dist/GaoYanJiu-Windows-*-x64.msi.sha256

name: Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build executables
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - name: Smoke-test the packaged exe
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:TEMP ("gaoyanjiu-smoke-" + [guid]::NewGuid().ToString("n"))
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $libraryFile = Join-Path $dest "library.json"
          if (Test-Path $libraryFile) { throw "temp data dir already has library.json" }
          $port = 18765
          $exe = Join-Path (Get-Location) "dist\GaoYanJiu.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--data-dir", $dest, "--serve", "--no-browser", "--port", "$port"
          ) -PassThru -WindowStyle Hidden
          try {
            $page = $null
            $deadline = (Get-Date).AddSeconds(90)
            do {
              if ($proc.HasExited) { throw "GaoYanJiu.exe exited early with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 3 -NoProxy
                if ($response.StatusCode -eq 200) { $page = $response; break }
              } catch {}
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if (-not $page) { throw "packaged exe did not return HTTP 200" }
            $token = [regex]::Match($page.Content, 'name="gao-token" content="([^"]+)"').Groups[1].Value
            if (-not $token) { throw "HTTP 200 page did not include a session token" }
            $headers = @{ "X-Gao-Token" = $token }
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/library/create" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            if (-not (Test-Path $libraryFile)) { throw "creating a library did not write library.json" }
            $paperBody = '{"title":"CI smoke paper","venue":"Nature","status":"Under Review","statusSince":"2026-11-14"}'
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/papers" -Headers $headers -ContentType "application/json" -Body $paperBody -NoProxy | Out-Null
            $saved = Get-Content -Raw -Encoding UTF8 $libraryFile
            if ($saved -notmatch "CI smoke paper") { throw "library.json does not contain the written paper" }
            $listed = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/papers?scope=all" -Headers $headers -NoProxy
            $papers = @($listed.papers)
            if ($papers.Count -ne 1 -or $papers[0].title -ne "CI smoke paper") {
              throw "reading the library did not return the written paper"
            }
            Write-Output "smoke ok: HTTP 200, wrote and read library.json"
            try {
              Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/shutdown" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            } catch {}
            $exitDeadline = (Get-Date).AddSeconds(20)
            while (-not $proc.HasExited -and (Get-Date) -lt $exitDeadline) { Start-Sleep -Milliseconds 500 }
          } finally {
            if (-not $proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null }
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GaoYanJiu-Windows-4.14
          if-no-files-found: error
          path: |
            windows/dist/GaoYanJiu.exe
            windows/dist/GaoYanJiu-cli.exe

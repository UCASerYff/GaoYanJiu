name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-96676ee3ca-r17']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          gaotest="$(mktemp -d "${RUNNER_TEMP%/}/gao-native-ocr-cross.XXXXXXXX")"
          trap 'rm -rf -- "$gaotest"' EXIT
          git init -q "$gaotest/GaoCaoZuo"
          git -C "$gaotest/GaoCaoZuo" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoCaoZuo.git 2f8184083553f21d9d8eac61de556f5467acfb6b
          git -C "$gaotest/GaoCaoZuo" checkout --quiet --detach a784b0b8355e158499acedabff0783c470c0ffb4
          test "$(git -C "$gaotest/GaoCaoZuo" rev-parse HEAD)" = "a784b0b8355e158499acedabff0783c470c0ffb4"
          git init -q "$gaotest/GaoWenJian"
          git -C "$gaotest/GaoWenJian" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoWenJian.git 1a4f0e7c1077857dff9cf2085f6367a3dd8d289c
          git -C "$gaotest/GaoWenJian" checkout --quiet --detach eb23f083cab2fc55bbee9b4af9d74d5c62296912
          test "$(git -C "$gaotest/GaoWenJian" rev-parse HEAD)" = "eb23f083cab2fc55bbee9b4af9d74d5c62296912"
          git init -q "$gaotest/GaoYanJiu"
          git -C "$gaotest/GaoYanJiu" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoYanJiu.git 8f62a65372ab7279587ffb8faa50a02b9019165e
          git -C "$gaotest/GaoYanJiu" checkout --quiet --detach 96676ee3cadba2df3d69f67fb90f993125ba1c1e
          test "$(git -C "$gaotest/GaoYanJiu" rev-parse HEAD)" = "96676ee3cadba2df3d69f67fb90f993125ba1c1e"
          printf '%s' '' | base64 -D > "$gaotest/fixtures.zip"
          ditto -x -k "$gaotest/fixtures.zip" "$gaotest/fixture"
          bash "$gaotest/fixture/run.sh" "$gaotest/GaoCaoZuo" "$gaotest/GaoWenJian" "$gaotest/GaoYanJiu"

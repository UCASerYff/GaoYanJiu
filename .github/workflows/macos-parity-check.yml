name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-4e1e054456-r16']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          gaotest="$(mktemp -d "${RUNNER_TEMP%/}/gao-native-ocr-cross.XXXXXXXX")"
          trap 'rm -rf -- "$gaotest"' EXIT
          git init -q "$gaotest/GaoCaoZuo"
          git -C "$gaotest/GaoCaoZuo" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoCaoZuo.git 58d004a093dca098761c16d96206dd1e558648b3
          git -C "$gaotest/GaoCaoZuo" checkout --quiet --detach 56b7058ab38f5c755a4b550dc635ce8196b406e2
          test "$(git -C "$gaotest/GaoCaoZuo" rev-parse HEAD)" = "56b7058ab38f5c755a4b550dc635ce8196b406e2"
          git init -q "$gaotest/GaoWenJian"
          git -C "$gaotest/GaoWenJian" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoWenJian.git 1a4f0e7c1077857dff9cf2085f6367a3dd8d289c
          git -C "$gaotest/GaoWenJian" checkout --quiet --detach eb23f083cab2fc55bbee9b4af9d74d5c62296912
          test "$(git -C "$gaotest/GaoWenJian" rev-parse HEAD)" = "eb23f083cab2fc55bbee9b4af9d74d5c62296912"
          git init -q "$gaotest/GaoYanJiu"
          git -C "$gaotest/GaoYanJiu" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoYanJiu.git 60a6a7585b15d6f6db81f35a59124332ca511bf4
          git -C "$gaotest/GaoYanJiu" checkout --quiet --detach 4e1e054456760c0d673f631ba04f6620c5e53cf0
          test "$(git -C "$gaotest/GaoYanJiu" rev-parse HEAD)" = "4e1e054456760c0d673f631ba04f6620c5e53cf0"
          printf '%s' '' | base64 -D > "$gaotest/fixtures.zip"
          ditto -x -k "$gaotest/fixtures.zip" "$gaotest/fixture"
          bash "$gaotest/fixture/run.sh" "$gaotest/GaoCaoZuo" "$gaotest/GaoWenJian" "$gaotest/GaoYanJiu"

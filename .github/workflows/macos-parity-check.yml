name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-bca59b1956-r20']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          gaotest="$(mktemp -d "${RUNNER_TEMP%/}/gao-native-ocr-cross.XXXXXXXX")"
          trap 'rm -rf -- "$gaotest"' EXIT
          git init -q "$gaotest/GaoCaoZuo"
          git -C "$gaotest/GaoCaoZuo" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoCaoZuo.git 09027eeaa6d59a68eb62bd98732765e5ea82853e
          git -C "$gaotest/GaoCaoZuo" checkout --quiet --detach 415ab677ed381c606ffb8242cfc553253efab246
          test "$(git -C "$gaotest/GaoCaoZuo" rev-parse HEAD)" = "415ab677ed381c606ffb8242cfc553253efab246"
          git init -q "$gaotest/GaoWenJian"
          git -C "$gaotest/GaoWenJian" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoWenJian.git 24b2fa4f4548fc33e1b788285fa5a876a8454b83
          git -C "$gaotest/GaoWenJian" checkout --quiet --detach dcce7355a5dfce50e8ce5fd97230c52eed5cb5d3
          test "$(git -C "$gaotest/GaoWenJian" rev-parse HEAD)" = "dcce7355a5dfce50e8ce5fd97230c52eed5cb5d3"
          git init -q "$gaotest/GaoYanJiu"
          git -C "$gaotest/GaoYanJiu" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoYanJiu.git 3f437df5e329038ece05fbd1b5c2072badd47dd3
          git -C "$gaotest/GaoYanJiu" checkout --quiet --detach bca59b195639b2e0a2d09dbf9ed4db264a988a92
          test "$(git -C "$gaotest/GaoYanJiu" rev-parse HEAD)" = "bca59b195639b2e0a2d09dbf9ed4db264a988a92"
          printf '%s' '' | base64 -D > "$gaotest/fixtures.zip"
          ditto -x -k "$gaotest/fixtures.zip" "$gaotest/fixture"
          bash "$gaotest/fixture/run.sh" "$gaotest/GaoCaoZuo" "$gaotest/GaoWenJian" "$gaotest/GaoYanJiu"

name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-d0d3b6243c-r19']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          gaotest="$(mktemp -d "${RUNNER_TEMP%/}/gao-native-ocr-cross.XXXXXXXX")"
          trap 'rm -rf -- "$gaotest"' EXIT
          git init -q "$gaotest/GaoCaoZuo"
          git -C "$gaotest/GaoCaoZuo" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoCaoZuo.git fba55081a8b8a1cf30cd1a8e892520485bcea88d
          git -C "$gaotest/GaoCaoZuo" checkout --quiet --detach 9cd1c951e70ae284f8e2d393fe31aef9930102c5
          test "$(git -C "$gaotest/GaoCaoZuo" rev-parse HEAD)" = "9cd1c951e70ae284f8e2d393fe31aef9930102c5"
          git init -q "$gaotest/GaoWenJian"
          git -C "$gaotest/GaoWenJian" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoWenJian.git ad503eb66bb6946561434c484c6073e6cdb9e66a
          git -C "$gaotest/GaoWenJian" checkout --quiet --detach d621d7c43d8ec2c8cd5f8d7063c3c6cdcae3f43b
          test "$(git -C "$gaotest/GaoWenJian" rev-parse HEAD)" = "d621d7c43d8ec2c8cd5f8d7063c3c6cdcae3f43b"
          git init -q "$gaotest/GaoYanJiu"
          git -C "$gaotest/GaoYanJiu" fetch --no-tags --quiet --depth=2 https://github.com/UCASerYff/GaoYanJiu.git 5dfea16eec50090cb09c6551a12dfe937a2be51c
          git -C "$gaotest/GaoYanJiu" checkout --quiet --detach d0d3b6243ca4f4526031ddffee0026eb0298db68
          test "$(git -C "$gaotest/GaoYanJiu" rev-parse HEAD)" = "d0d3b6243ca4f4526031ddffee0026eb0298db68"
          printf '%s' '' | base64 -D > "$gaotest/fixtures.zip"
          ditto -x -k "$gaotest/fixtures.zip" "$gaotest/fixture"
          bash "$gaotest/fixture/run.sh" "$gaotest/GaoCaoZuo" "$gaotest/GaoWenJian" "$gaotest/GaoYanJiu"
